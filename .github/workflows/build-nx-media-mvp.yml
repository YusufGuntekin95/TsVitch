name: Build NX Media Subtitle Stable

on:
  push:
    branches:
      - nx-media-subtitle-stable
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare bundled subtitle font
        run: cp resources/font/switch_font.ttf resources/font/subfont.ttf

      - name: Generate NX Media app icon
        run: |
          python3 -m pip install --user pillow
          python3 scripts/generate_nx_media_icon.py

      - name: Inject audio subtitle track menu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpp = Path('tsvitch/source/fragment/player_setting.cpp')
          s = cpp.read_text(encoding='utf-8')

          helper_anchor = 'using namespace brls::literals;\n'
          helper = r'''

          namespace {
          struct PlayerTrack {
              int64_t id = -1;
              std::string type;
              std::string lang;
              std::string title;
              std::string codec;
              bool selected = false;
          };

          std::string languageLabel(const std::string& lang) {
              if (lang == "tur" || lang == "tr") return "Türkçe";
              if (lang == "eng" || lang == "en") return "İngilizce";
              if (lang == "deu" || lang == "ger" || lang == "de") return "Almanca";
              if (lang == "fra" || lang == "fre" || lang == "fr") return "Fransızca";
              if (lang == "ita" || lang == "it") return "İtalyanca";
              if (lang == "spa" || lang == "es") return "İspanyolca";
              if (lang == "por" || lang == "pt") return "Portekizce";
              if (lang == "ara" || lang == "ar") return "Arapça";
              return lang;
          }

          std::string trackLabel(const PlayerTrack& track, size_t fallbackIndex) {
              if (!track.title.empty()) return track.title;
              std::string lang = languageLabel(track.lang);
              if (!lang.empty()) return lang;
              if (track.type == "audio") return fmt::format("Ses {}", fallbackIndex + 1);
              return fmt::format("Altyazı {}", fallbackIndex + 1);
          }

          std::vector<PlayerTrack> getPlayerTracks(const std::string& wantedType) {
              std::vector<PlayerTrack> tracks;
              mpv_handle* handle = MPVCore::instance().getHandle();
              if (!handle) return tracks;

              mpv_node node{};
              if (mpvGetProperty(handle, "track-list", MPV_FORMAT_NODE, &node) < 0) return tracks;
              if (node.format != MPV_FORMAT_NODE_ARRAY || node.u.list == nullptr) {
                  mpvFreeNodeContents(&node);
                  return tracks;
              }

              mpv_node_list* list = node.u.list;
              for (int i = 0; i < list->num; i++) {
                  const mpv_node& item = list->values[i];
                  if (item.format != MPV_FORMAT_NODE_MAP || item.u.list == nullptr) continue;

                  PlayerTrack track;
                  mpv_node_list* map = item.u.list;
                  for (int j = 0; j < map->num; j++) {
                      if (map->keys[j] == nullptr) continue;
                      const std::string key = map->keys[j];
                      const mpv_node& value = map->values[j];
                      if (key == "id" && value.format == MPV_FORMAT_INT64) {
                          track.id = value.u.int64;
                      } else if (key == "type" && value.format == MPV_FORMAT_STRING && value.u.string) {
                          track.type = value.u.string;
                      } else if (key == "lang" && value.format == MPV_FORMAT_STRING && value.u.string) {
                          track.lang = value.u.string;
                      } else if (key == "title" && value.format == MPV_FORMAT_STRING && value.u.string) {
                          track.title = value.u.string;
                      } else if (key == "codec" && value.format == MPV_FORMAT_STRING && value.u.string) {
                          track.codec = value.u.string;
                      } else if (key == "selected" && value.format == MPV_FORMAT_FLAG) {
                          track.selected = value.u.flag != 0;
                      }
                  }
                  if (track.type == wantedType && track.id >= 0) tracks.push_back(track);
              }

              mpvFreeNodeContents(&node);
              return tracks;
          }
          }  // namespace
          '''
          if 'struct PlayerTrack' not in s:
              if helper_anchor not in s:
                  raise SystemExit('player_setting helper anchor not found')
              s = s.replace(helper_anchor, helper_anchor + helper, 1)

          if '    setupTrackSetting();\n' not in s:
              needle = '    setupCommonSetting();\n'
              if needle not in s:
                  raise SystemExit('setupCommonSetting call not found')
              s = s.replace(needle, needle + '    setupTrackSetting();\n', 1)

          track_methods = r'''

          void PlayerSetting::setupTrackSetting() {
              btnSubtitle->setText("Altyazı");
              btnAudioTrack->setText("Ses dili");
              refreshTrackDetails();

              btnSubtitle->registerClickAction([this](View* view) {
                  auto tracks = getPlayerTracks("sub");
                  std::vector<std::string> options = {"Kapalı"};
                  int selectedIndex = 0;

                  for (size_t i = 0; i < tracks.size(); i++) {
                      options.push_back(trackLabel(tracks[i], i));
                      if (tracks[i].selected) selectedIndex = static_cast<int>(i) + 1;
                  }

                  BaseDropdown::text(
                      "Altyazı", options,
                      [this, tracks, options](int data) {
                          if (data <= 0) {
                              MPVCore::instance().command_async("set", "sid", "no");
                              MPVCore::instance().command_async("set", "sub-visibility", "no");
                              btnSubtitle->setDetailText("Kapalı");
                              return;
                          }

                          const size_t trackIndex = static_cast<size_t>(data - 1);
                          if (trackIndex >= tracks.size()) return;
                          const auto& track = tracks[trackIndex];

                          brls::Logger::info("NX Media subtitle selected id={} lang={} codec={} title={}",
                                             track.id, track.lang, track.codec, track.title);
                          MPVCore::instance().command_async("set", "sid", track.id);
                          MPVCore::instance().command_async("set", "sub-forced-only", "no");
                          MPVCore::instance().command_async("set", "sub-visibility", "yes");
                          btnSubtitle->setDetailText(options[data]);
                      },
                      selectedIndex);
                  return true;
              });

              btnAudioTrack->registerClickAction([this](View* view) {
                  auto tracks = getPlayerTracks("audio");
                  if (tracks.empty()) {
                      btnAudioTrack->setDetailText("Yok");
                      return true;
                  }

                  std::vector<std::string> options;
                  int selectedIndex = 0;
                  for (size_t i = 0; i < tracks.size(); i++) {
                      options.push_back(trackLabel(tracks[i], i));
                      if (tracks[i].selected) selectedIndex = static_cast<int>(i);
                  }

                  BaseDropdown::text(
                      "Ses dili", options,
                      [this, tracks, options](int data) {
                          if (data < 0 || static_cast<size_t>(data) >= tracks.size()) return;
                          MPVCore::instance().command_async("set", "aid", tracks[data].id);
                          btnAudioTrack->setDetailText(options[data]);
                      },
                      selectedIndex);
                  return true;
              });
          }

          void PlayerSetting::refreshTrackDetails() {
              auto subtitles = getPlayerTracks("sub");
              std::string subtitleDetail = "Kapalı";
              for (size_t i = 0; i < subtitles.size(); i++) {
                  if (subtitles[i].selected) {
                      subtitleDetail = trackLabel(subtitles[i], i);
                      break;
                  }
              }
              btnSubtitle->setDetailText(subtitleDetail);

              auto audioTracks = getPlayerTracks("audio");
              if (audioTracks.empty()) {
                  btnAudioTrack->setDetailText("Yok");
                  return;
              }

              std::string audioDetail = trackLabel(audioTracks[0], 0);
              for (size_t i = 0; i < audioTracks.size(); i++) {
                  if (audioTracks[i].selected) {
                      audioDetail = trackLabel(audioTracks[i], i);
                      break;
                  }
              }
              btnAudioTrack->setDetailText(audioDetail);
          }
          '''
          if 'void PlayerSetting::setupTrackSetting()' not in s:
              needle = 'void PlayerSetting::setupCommonSetting() {'
              if needle not in s:
                  raise SystemExit('setupCommonSetting definition not found')
              s = s.replace(needle, track_methods + '\n\n' + needle, 1)
          cpp.write_text(s, encoding='utf-8')

          hpp = Path('tsvitch/include/fragment/player_setting.hpp')
          s = hpp.read_text(encoding='utf-8')
          if 'void setupTrackSetting();' not in s:
              needle = '    void setupCommonSetting();\n'
              if needle not in s:
                  raise SystemExit('player_setting.hpp method anchor not found')
              s = s.replace(needle, needle + '    void setupTrackSetting();\n    void refreshTrackDetails();\n', 1)
          if 'btnSubtitle' not in s:
              needle = '    BRLS_BIND(brls::DetailCell, btnSleep, "setting/sleep");\n'
              if needle not in s:
                  raise SystemExit('player_setting.hpp binding anchor not found')
              s = s.replace(needle, needle + '    BRLS_BIND(brls::DetailCell, btnSubtitle, "setting/track/subtitle");\n    BRLS_BIND(brls::DetailCell, btnAudioTrack, "setting/track/audio");\n', 1)
          hpp.write_text(s, encoding='utf-8')

          xml = Path('resources/xml/fragment/player_setting.xml')
          s = xml.read_text(encoding='utf-8')
          if 'setting/track/subtitle' not in s:
              anchor = '''                </brls:Box>
                <brls:Header
                        id="setting/video/custom/header"'''
              section = '''                </brls:Box>

                <brls:Header
                        width="auto"
                        height="auto"
                        title="Ses ve Altyazı"
                        marginBottom="0px"/>
                <brls:Box
                        width="100%"
                        height="auto"
                        axis="column"
                        marginBottom="30px">
                    <brls:DetailCell id="setting/track/subtitle"/>
                    <brls:DetailCell id="setting/track/audio"/>
                </brls:Box>

                <brls:Header
                        id="setting/video/custom/header"'''
              if anchor not in s:
                  raise SystemExit('player_setting.xml anchor not found')
              s = s.replace(anchor, section, 1)
          xml.write_text(s, encoding='utf-8')
          PY

      - name: Register NX Media views and theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsvitch/source/utils/register_helper.cpp')
          s = p.read_text(encoding='utf-8')

          include_anchor = '#include "fragment/home_downloads.hpp"\n'
          if '#include "fragment/home_vod.hpp"' not in s:
              s = s.replace(include_anchor,
                  include_anchor + '#include "fragment/home_vod.hpp"\n#include "fragment/home_series.hpp"\n', 1)

          register_anchor = '    brls::Application::registerXMLView("HomeDownloads", HomeDownloads::create);\n'
          if 'registerXMLView("HomeVod"' not in s:
              s = s.replace(register_anchor,
                  register_anchor + '    brls::Application::registerXMLView("HomeVod", HomeVod::create);\n'
                  '    brls::Application::registerXMLView("HomeSeries", HomeSeries::create);\n', 1)

          theme_anchor = 'void Register::initCustomTheme() {\n'
          if 'color/nx_background' not in s:
              theme = '''void Register::initCustomTheme() {
              brls::Theme::getLightTheme().addColor("color/nx_background", nvgRGB(244, 246, 249));
              brls::Theme::getDarkTheme().addColor("color/nx_background", nvgRGB(16, 18, 23));
              brls::Theme::getLightTheme().addColor("color/nx_sidebar", nvgRGB(232, 236, 241));
              brls::Theme::getDarkTheme().addColor("color/nx_sidebar", nvgRGB(22, 25, 31));
              brls::Theme::getLightTheme().addColor("color/nx_surface", nvgRGB(226, 231, 237));
              brls::Theme::getDarkTheme().addColor("color/nx_surface", nvgRGB(31, 35, 43));
              brls::Theme::getLightTheme().addColor("color/nx_badge", nvgRGB(46, 151, 137));
              brls::Theme::getDarkTheme().addColor("color/nx_badge", nvgRGB(46, 151, 137));
              brls::Theme::getLightTheme().addColor("color/nx_accent", nvgRGB(46, 184, 164));
              brls::Theme::getDarkTheme().addColor("color/nx_accent", nvgRGB(85, 214, 194));
          '''
              if theme_anchor not in s:
                  raise SystemExit('Theme anchor not found')
              s = s.replace(theme_anchor, theme, 1)

          if 'registerXMLView("HomeVod"' not in s:
              raise SystemExit('HomeVod registration failed')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Brand NX Media and harden player startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cmake = Path('CMakeLists.txt')
          s = cmake.read_text(encoding='utf-8')
          old = 'COMMAND ${NX_NACPTOOL_EXE} --create ${PROJECT_NAME} ${PROJECT_AUTHOR} ${APP_VERSION} ${PROJECT_NAME}.nacp'
          new = 'COMMAND ${NX_NACPTOOL_EXE} --create "NX Media" "YusufGuntekin95" ${APP_VERSION} ${PROJECT_NAME}.nacp'
          if old not in s and 'NX Media' not in s:
              raise SystemExit('Switch NACP branding anchor not found')
          s = s.replace(old, new, 1)
          cmake.write_text(s, encoding='utf-8')

          player = Path('tsvitch/source/activity/live_player_activity.cpp')
          s = player.read_text(encoding='utf-8')

          video_needle = '    video = dynamic_cast<VideoView*>(this->getView("video"));\n'
          if 'NX Media: VideoView not found' not in s:
              if video_needle not in s:
                  raise SystemExit('VideoView anchor not found')
              s = s.replace(video_needle, video_needle + '''    if (!video) {
              brls::Logger::error("NX Media: VideoView not found; aborting player startup");
              brls::Application::popActivity();
              return;
          }
          ''', 1)

          ad_pattern = re.compile(
              r'(?P<i>^[ \t]*)this->getAdUrlFromServer\(\[&\]\(const std::string& adUrl\) \{\n'
              r'(?P=i)    brls::Logger::debug\("LiveActivity: adUrl: \{\}", adUrl\);\n'
              r'(?P=i)    if \(!adUrl\.empty\(\)\) \{\n'
              r'(?P=i)        this->startAd\(adUrl\);\n'
              r'(?P=i)    \} else \{\n'
              r'(?P=i)        this->startLive\(\);\n'
              r'(?P=i)    \}\n'
              r'(?P=i)\}\);', re.M)
          s, replaced = ad_pattern.subn(lambda m: m.group('i') + 'this->startLive();', s)
          if replaced == 0 and 'NX Media direct playback' not in s:
              raise SystemExit('Ad gate blocks not found')

          s = s.replace('    this->video->hideSubtitleSetting();\n', '')
          marker = '    brls::Logger::debug("LiveActivity: onContentAvailable");\n'
          if 'NX Media direct playback' not in s:
              s = s.replace(marker, marker + '    brls::Logger::info("NX Media direct playback: ad backend bypassed");\n', 1)

          player.write_text(s, encoding='utf-8')
          print(f'Bypassed {replaced} TsVitch ad gate(s)')
          PY

      - name: Inject Switch subtitle renderer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsvitch/source/view/mpv_core.cpp')
          s = p.read_text(encoding='utf-8')

          include_needle = '#include <clocale>\n'
          if '#include <fstream>' not in s:
              s = s.replace(include_needle, include_needle + '#include <fstream>\n#include <sys/stat.h>\n', 1)

          init_needle = 'void MPVCore::init() {\n    setlocale(LC_NUMERIC, "C");\n'
          init_block = '''void MPVCore::init() {
              setlocale(LC_NUMERIC, "C");

          #if defined(__SWITCH__)
              mkdir("sdmc:/config", 0777);
              mkdir("sdmc:/config/tsvitch", 0777);
              mkdir("sdmc:/switch/NXMedia", 0777);

              auto installSubtitleFont = [](const std::string& targetPath) {
                  struct stat st{};
                  if (stat(targetPath.c_str(), &st) == 0 && st.st_size > 1024 * 1024) return;

                  std::ifstream bundled("romfs:/font/subfont.ttf", std::ios::binary);
                  if (!bundled.good()) {
                      brls::Logger::error("NX Media bundled subtitle font missing");
                      return;
                  }
                  std::ofstream output(targetPath, std::ios::binary | std::ios::trunc);
                  output << bundled.rdbuf();
                  output.close();
                  brls::Logger::info("NX Media installed subtitle font: {}", targetPath);
              };

              installSubtitleFont("sdmc:/config/tsvitch/subfont.ttf");
              installSubtitleFont("sdmc:/switch/NXMedia/subfont.ttf");
          #endif
          '''
          if 'sdmc:/switch/NXMedia/subfont.ttf' not in s:
              if init_needle not in s:
                  raise SystemExit('MPV init anchor not found')
              s = s.replace(init_needle, init_block, 1)

          option_needle = '    mpvSetOptionString(mpv, "pulse-latency-hacks", "no");\n'
          option_block = '''    mpvSetOptionString(mpv, "pulse-latency-hacks", "no");

          #if defined(__SWITCH__)
              // libmpv on Switch resolves device-prefixed paths reliably. Keep the
              // app config itself untouched, but point mpv/libass at the same SD
              // directory through sdmc:, exactly like native Switch players do.
              mpvSetOptionString(mpv, "config-dir", "sdmc:/config/tsvitch");
              mpvSetOptionString(mpv, "sub-fonts-dir", "sdmc:/config/tsvitch");
              mpvSetOptionString(mpv, "embeddedfonts", "yes");
              mpvSetOptionString(mpv, "sub-visibility", "yes");
              mpvSetOptionString(mpv, "sub-forced-only", "no");
          #endif
          '''
          if 'libmpv on Switch resolves device-prefixed paths reliably' not in s:
              if option_needle not in s:
                  raise SystemExit('MPV option anchor not found')
              s = s.replace(option_needle, option_block, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build Nintendo Switch NRO
        run: |
          docker run --platform linux/amd64 --rm \
            -e GA_ID="nx-media-mvp" \
            -e GA_KEY="nx-media-mvp" \
            -e SERVER_URL="https://example.invalid" \
            -e SERVER_TOKEN="nx-media-mvp" \
            -e M3U8_URL="https://example.invalid/default.m3u8" \
            -v $(pwd):/data devkitpro/devkita64:latest \
            bash -c "/data/scripts/build_switch.sh"

      - name: Name NX Media build
        run: sudo install -m 0644 cmake-build-switch/TsVitch.nro NXMedia.nro

      - name: Upload NX Media
        uses: actions/upload-artifact@v4
        with:
          name: NXMedia-subtitle-stable
          path: NXMedia.nro
