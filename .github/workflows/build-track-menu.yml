name: Build TsVitch Track Menu Mod

on:
  push:
    branches:
      - subtitle-audio-menu
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply subtitle/audio menu patch
        run: git apply .github/patches/subtitle-audio-menu.patch

      - name: Build Nintendo Switch NRO
        run: |
          docker run --platform linux/amd64 --rm \
            -e GA_ID="mod-build" \
            -e GA_KEY="mod-build" \
            -e SERVER_URL="https://example.invalid" \
            -e SERVER_TOKEN="mod-build" \
            -e M3U8_URL="https://example.invalid/default.m3u8" \
            -v $(pwd):/data devkitpro/devkita64:latest \
            bash -c "/data/scripts/build_switch.sh"

      - name: Upload TsVitch.nro
        uses: actions/upload-artifact@v4
        with:
          name: TsVitch-track-menu
          path: cmake-build-switch/TsVitch.nro
